services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: split_money
      POSTGRES_USER: split_money
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U split_money -d split_money"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
